# ===================================================================
# Office Visitor Management System - Application Configuration
# ===================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=visitor-management-system

# MySQL Database Configuration
# Sensitive credentials are read from Environment Variables (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:visitor_management_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Static Resource Configuration
spring.web.resources.static-locations=classpath:/static/

# -------------------------------------------------------------------
# Security & Initial Admin Configuration
# Credentials are read securely from Environment Variables
# -------------------------------------------------------------------
vms.admin.username=${ADMIN_USERNAME:admin}
vms.admin.password=${ADMIN_PASSWORD:IP@2026}
vms.admin.email=${ADMIN_EMAIL:admin@vms.com}
vms.admin.name=${ADMIN_NAME:System Administrator}

# CORS Allowed Origins (Comma-separated list)
vms.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

# Session Management & Cookie Hardening
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
